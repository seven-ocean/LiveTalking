<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>臻灵数字人 demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px 34px 34px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        /* ---- 顶部标题 ---- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .header .tag {
            font-size: 12px;
            background: rgba(167,139,250,0.15);
            border: 1px solid rgba(167,139,250,0.25);
            color: #a78bfa;
            padding: 4px 14px;
            border-radius: 20px;
        }

        /* ---- 选项行 ---- */
        .option {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option label {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .option input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 5px;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .option input[type="checkbox"]:checked {
            background: #7c3aed;
            border-color: #7c3aed;
        }
        .option input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        /* ---- 按钮 ---- */
        button {
            padding: 9px 22px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: #fff;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

        #start {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 4px 15px rgba(5,150,105,0.3);
        }
        #start:hover:not(:disabled) {
            box-shadow: 0 6px 25px rgba(5,150,105,0.45);
            transform: translateY(-1px);
        }

        #stop {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 4px 15px rgba(220,38,38,0.3);
        }
        #stop:hover:not(:disabled) {
            box-shadow: 0 6px 25px rgba(220,38,38,0.45);
            transform: translateY(-1px);
        }

        #btn_start_record, #btn_stop_record {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
        }
        #btn_start_record:hover:not(:disabled), #btn_stop_record:hover:not(:disabled) {
            background: rgba(255,255,255,0.14);
        }

        /* ---- 表单 & 输入框 ---- */
        .form-inline {
            margin-top: 14px;
        }

        .form-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-group p {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            margin-bottom: 2px;
        }

        .form-group textarea {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group textarea:focus {
            border-color: rgba(124,58,237,0.5);
        }
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .form-group button[type="submit"] {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            box-shadow: 0 4px 15px rgba(124,58,237,0.35);
            white-space: nowrap;
            align-self: flex-end;
        }
        .form-group button[type="submit"]:hover:not(:disabled) {
            box-shadow: 0 6px 25px rgba(124,58,237,0.5);
            transform: translateY(-1px);
        }

        /* ---- ASR 图标按钮 ---- */
        .asr-buttons {
            display: flex;
            gap: 6px;
            align-self: flex-end;
            margin-right: 2px;
        }
        .btn-asr {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
            font-size: 16px;
            line-height: 1;
        }
        .btn-asr:hover {
            background: rgba(124,58,237,0.2);
            border-color: rgba(124,58,237,0.4);
            color: #c4b5fd;
        }
        .btn-asr.recording {
            background: rgba(239,68,68,0.2);
            border-color: rgba(239,68,68,0.5);
            color: #fca5a5;
            animation: pulse-rec 1.2s infinite;
        }
        @keyframes pulse-rec {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
            50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
        }
        .btn-asr svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .asr-status {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            align-self: flex-end;
            margin-right: 4px;
            white-space: nowrap;
        }
        .asr-status.processing {
            color: #c4b5fd;
        }
        .asr-status.error {
            color: #fca5a5;
        }

        /* ---- 媒体区 ---- */
        #media {
            max-width: 100%;
            margin-top: 18px;
        }

        #media h2 {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        video {
            width: 100%;
            max-width: 600px;
            border-radius: 14px;
            display: block;
            background: #000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        /* ---- 聊天消息区（新增） ---- */
        .chat-area {
            margin-top: 18px;
        }

        .chat-messages {
            background: rgba(0,0,0,0.25);
            border-radius: 14px;
            padding: 14px 16px;
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }

        .msg {
            max-width: 88%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: rgba(255,255,255,0.08);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .msg.system {
            align-self: center;
            background: rgba(245,158,11,0.12);
            color: #fbbf24;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            max-width: 92%;
        }

        .msg .sender {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.55;
            margin-bottom: 2px;
        }

        .thinking-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a78bfa;
            margin-top: 4px;
        }
        .thinking-indicator.active {
            display: flex;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(167,139,250,0.2);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- 大模型切换按钮 ---- */
        .model-toggle {
            display: inline-flex;
            gap: 6px;
            margin-left: 10px;
        }
        .model-toggle .btn-mode {
            padding: 3px 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.2s;
        }
        .model-toggle .btn-mode:hover {
            background: rgba(255,255,255,0.06);
        }
        .model-toggle .btn-mode.active {
            background: rgba(124,58,237,0.25);
            border-color: #7c3aed;
            color: #a78bfa;
        }

        /* ---- 配置信息展示与编辑 ---- */
        .config-info {
            margin-top: 14px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .ci-section {
            padding: 12px 16px;
        }
        .ci-section + .ci-section {
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .ci-section .ci-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .ci-section .ci-header .ci-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 10px;
        }
        .ci-section .ci-header .ci-badge.local {
            background: rgba(16,185,129,0.15);
            color: #34d399;
            border: 1px solid rgba(16,185,129,0.2);
        }
        .ci-section .ci-header .ci-badge.qianwen {
            background: rgba(245,158,11,0.15);
            color: #fbbf24;
            border: 1px solid rgba(245,158,11,0.2);
        }
        .ci-section .ci-header .ci-badge.active-qianwen {
            background: rgba(245,158,11,0.25);
            border-color: #fbbf24;
            box-shadow: 0 0 10px rgba(245,158,11,0.25);
        }
        .ci-section .ci-header .ci-badge.online {
            background: rgba(96,165,250,0.15);
            color: #60a5fa;
            border: 1px solid rgba(96,165,250,0.2);
        }
        .ci-section .ci-header .ci-badge.active-local {
            background: rgba(16,185,129,0.25);
            border-color: #34d399;
            box-shadow: 0 0 10px rgba(16,185,129,0.25);
        }
        .ci-section .ci-header .ci-badge.active-online {
            background: rgba(96,165,250,0.25);
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96,165,250,0.25);
        }
        .ci-section .ci-header .ci-badge.inactive {
            opacity: 0.4;
        }
        .ci-section .ci-field {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }
        .ci-section .ci-field .ci-label {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            min-width: 36px;
            flex-shrink: 0;
        }
        .ci-section .ci-field input {
            flex: 1;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.25);
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .ci-section .ci-field input:focus {
            border-color: rgba(124,58,237,0.4);
            background: rgba(0,0,0,0.4);
            color: #e0e0e0;
        }
        .ci-section .ci-field input::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .ci-section .ci-field input.ci-key-field {
            -webkit-text-security: disc;
        }
        .ci-section .ci-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            margin-top: 6px;
        }
        .ci-section .ci-actions .btn-ci {
            padding: 3px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            color: #fff;
            transition: all 0.15s;
        }
        .ci-section .ci-actions .btn-ci:active { transform: scale(0.95); }
        .ci-section .ci-actions .btn-ci-save {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
        }
        .ci-section .ci-actions .btn-ci-save:hover { opacity: 0.85; }
        .ci-section .ci-actions .btn-ci-edit {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ci-section .ci-actions .btn-ci-edit:hover { background: rgba(255,255,255,0.14); }
        .ci-status {
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            padding: 0 16px 10px;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .header h1 { font-size: 20px; }
            video { max-width: 100%; }
            .form-group textarea { min-width: 140px; }
            .msg { max-width: 95%; }
        }

        /* ===== 全屏双栏布局：左侧画面 / 右侧参数与对话 ===== */
        html, body { height: 100%; }
        body {
            height: 100vh;
            min-height: 0;
            padding: 0;
            overflow: hidden;
            display: block;
            background: radial-gradient(1200px 600px at 20% 0%, #1e1b4b 0%, #0f0c29 45%, #080812 100%);
        }
        .container {
            width: 100vw;
            height: 100vh;
            max-width: none;
            padding: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            display: flex;
            align-items: stretch;
        }

        /* 左侧画面 */
        .stage {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 14px 14px 18px;
            gap: 10px;
        }
        .stage-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stage-top .brand { display: flex; align-items: center; gap: 10px; }
        .stage-top h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stage-top .tag {
            font-size: 11px;
            background: rgba(167,139,250,0.15);
            border: 1px solid rgba(167,139,250,0.25);
            color: #a78bfa;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .stage-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .stage-controls button { padding: 7px 16px; font-size: 13px; border-radius: 9px; }
        .stage-controls #connStatus { margin-right: 2px; }

        .video-wrap {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 18px 45px rgba(0,0,0,0.5);
        }
        .video-wrap video {
            width: 100%;
            height: 100%;
            max-width: none;
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
            display: block;
        }
        .video-overlay {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: none;
        }
        .video-chip {
            font-size: 11px;
            line-height: 1;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 6px 10px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .video-chip.error {
            color: #fca5a5;
            border-color: rgba(239,68,68,0.4);
        }

        /* 右侧参数 / 对话栏 */
        .sidebar {
            flex: 0 0 400px;
            width: 400px;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px 16px;
            background: rgba(8,8,20,0.6);
            border-left: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }

        .panel {
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 10px 12px;
        }
        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 8px;
        }
        .panel-title .panel-sub {
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            color: rgba(255,255,255,0.3);
        }
        .panel-title .model-toggle { margin-left: auto; text-transform: none; letter-spacing: 0; }
        .panel .option { margin-bottom: 6px; }
        .panel .option:last-child { margin-bottom: 0; }

        .row { display: flex; align-items: center; gap: 8px; }
        .row input[type="text"] {
            flex: 1 1 auto;
            min-width: 0;
            height: 34px;
            padding: 0 12px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: #e0e0e0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .row input[type="text"]:focus { border-color: rgba(124,58,237,0.5); }
        .row input[type="text"]::placeholder { color: rgba(255,255,255,0.3); }

        /* 直接朗读输入区 */
        #ttsText {
            width: 100%;
            height: 104px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: #e0e0e0;
            font-size: 13px;
            line-height: 1.6;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        #ttsText:focus { border-color: rgba(124,58,237,0.5); }
        #ttsText::placeholder { color: rgba(255,255,255,0.3); }
        .tts-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .tts-actions .asr-status {
            flex: 1 1 auto;
            align-self: center;
            white-space: normal;
        }
        .tts-actions #btnTts { margin-left: auto; }

        .btn-accent {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            box-shadow: 0 4px 12px rgba(124,58,237,0.3);
            padding: 8px 16px;
            font-size: 13px;
            white-space: nowrap;
        }
        .btn-accent:hover:not(:disabled) {
            box-shadow: 0 6px 18px rgba(124,58,237,0.45);
            transform: translateY(-1px);
        }

        .sidebar .form-inline { margin-top: 0; }
        .sidebar .form-group { display: block; }
        .sidebar .form-group p { width: auto; }
        .sidebar .form-group textarea {
            width: 100%;
            height: 60px;
            min-width: 0;
            resize: none;
            padding: 9px 12px;
            font-size: 13px;
        }
        .echo-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .echo-actions .asr-buttons { align-self: center; }
        .echo-actions #sendBtn { margin-left: auto; }
        .thinking-indicator { margin-top: 6px; }

<script>

// ===== WebRTC（原始逻辑，未改动） =====
var pc = null;

function negotiate() {
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    return pc.createOffer().then((offer) => {
        return pc.setLocalDescription(offer);
    }).then(() => {
        return new Promise((resolve) => {
            if (pc.iceGatheringState === 'complete') {
                resolve();
            } else {
                const checkState = () => {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                };
                pc.addEventListener('icegatheringstatechange', checkState);
            }
        });
    }).then(() => {
        var offer = pc.localDescription;
        return fetch('./offer', {
            body: JSON.stringify({
                sdp: offer.sdp,
                type: offer.type,
            }),
            headers: {
                'Content-Type': 'application/json'
            },
            method: 'POST'
        });
    }).then((response) => {
        return response.json();
    }).then((answer) => {
        document.getElementById('sessionid').value = answer.sessionid
        return pc.setRemoteDescription(answer);
    }).catch((e) => {
        alert(e);
    });
}

function start() {
    var config = {
        sdpSemantics: 'unified-plan'
    };

    if (document.getElementById('use-stun').checked) {
        config.iceServers = [{ urls: ['stun:stun.l.google.com:19302'] }];
    }

    pc = new RTCPeerConnection(config);

    pc.addEventListener('track', (evt) => {
        if (evt.track.kind == 'video') {
            document.getElementById('video').srcObject = evt.streams[0];
        } else {
            document.getElementById('audio').srcObject = evt.streams[0];
        }
    });

    pc.addEventListener('connectionstatechange', () => {
        var el = document.getElementById('connStatus');
        if (el) el.textContent = pc.connectionState;
    });

    document.getElementById('connStatus').textContent = '连接中…';
    document.getElementById('start').style.display = 'none';
    negotiate();
    document.getElementById('stop').style.display = 'inline-block';
}

function stop() {
    document.getElementById('stop').style.display = 'none';
    document.getElementById('connStatus').textContent = '未连接';
    setTimeout(() => {
        pc.close();
    }, 500);
}

window.onunload = function(event) {
    setTimeout(() => {
        pc.close();
    }, 500);
};

window.onbeforeunload = function (e) {
    setTimeout(() => {
        pc.close();
    }, 500);
    e = e || window.event
    if (e) {

}

/**
 * 过滤不可朗读字符，使文本适合 TTS 数字人播报
 * - 移除 Emoji/颜文字（Unicode 表情符号）
 * - 移除 Markdown 标记：**粗体**、*斜体*、`行内码`、~~删除线~~、> 引用
 * - 保留文字内容和标点
 */
function sanitizeForTTS(text) {
    return text
        // 移除 Emoji（Unicode 表情符号区块）
        .replace(/[\u{1F000}-\u{1FFFF}]/gu, '')
        .replace(/[\u{2600}-\u{27BF}]/gu, '')     // 杂项符号
        .replace(/[\u{2700}-\u{27BF}]/gu, '')     // 装饰符号
        .replace(/[\u{2300}-\u{23FF}]/gu, '')     // 杂项技术符号
        .replace(/[\u{FE00}-\u{FE0F}]/gu, '')     // 变体选择符（Emoji 颜色）
        .replace(/[\u{200D}]/gu, '')              // 零宽连字（Emoji 组合）
        // 移除常见颜文字符号
        .replace(/[\(\)\[\]{}（）【】]/g, '')       // 保留括号内容但移除括号本身（可选）
        .replace(/[❤️🔥⭐✨🌟💫💥💢💤💦💪💯]/g, '')
        // 移除 Markdown 标记
        .replace(/\*{1,2}([^*]+)\*{1,2}/g, '$1') // **粗体** 和 *斜体*
        .replace(/`{1,3}[^`]*`{1,3}/g, '')       // `行内码`
        .replace(/~{2}([^~]+)~{2}/g, '$1')        // ~~删除线~~
        .replace(/^>\s+/gm, '')                   // > 引用行
        // 清理多余空格
        .replace(/\s+/g, ' ')
        .trim();
}

function setThinking(active) {
    var indicator = document.getElementById('thinkingIndicator');
    var sendBtn = document.getElementById('sendBtn');
    if (active) {

        sendBtn.disabled = false;
    }
}

async function callDeepSeek(messages) {
    var cfg = getCurrentConfig();
    if (!cfg.url) throw new Error('当前模式未配置 API 地址，请在上方配置后保存');
    if (!cfg.key) throw new Error('当前模式未配置 API Key');
    if (!cfg.model) throw new Error('当前模式未配置模型名称');
    var response = await fetch(cfg.url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + cfg.key
        },
        body: JSON.stringify({
            model: cfg.model,
            messages: messages,
            stream: false,
            max_tokens: 1024,
            temperature: 0.7
        })
    });
    if (!response.ok) {
        var errText = await response.text();
        throw new Error('API error ' + response.status + ': ' + errText);
    }
    var data = await response.json();
    if (!data.choices || !data.choices[0] || !data.choices[0].message) {
        throw new Error('API 返回格式异常');
    }
    return data.choices[0].message.content;
}

// ===== ASR 语音识别（SenseVoice） =====
var ASR_URL = 'http://localhost:60000/api/v1/asr';
var mediaRecorder = null;
var audioChunks = [];
var isRecording = false;

function setAsrStatus(msg, type) {
    var el = document.getElementById('asrStatus');
    el.textContent = msg;
    el.className = 'asr-status' + (type ? ' ' + type : '');
}

function callASR(audioBlob, filename) {
    setAsrStatus('识别中…', 'processing');
    var formData = new FormData();
    formData.append('files', audioBlob, filename || 'audio.wav');
    formData.append('lang', 'zh');
    formData.append('use_itn', 'true');
    formData.append('keys', filename || 'audio');

    return fetch(ASR_URL, {
        method: 'POST',
        body: formData
    })
    .then(function(resp) {
        if (!resp.ok) {
            throw new Error('ASR 服务返回 ' + resp.status);
        }
        return resp.json();
    })
    .then(function(data) {
        var items = data.result || [];
        if (items.length === 0) {
            throw new Error('ASR 未识别到内容');
        }
        var text = items[0].text || items[0].clean_text || '';
        setAsrStatus('');
        return text;
    })
    .catch(function(err) {
        setAsrStatus('识别失败: ' + err.message, 'error');
        throw err;
    });
}

function fillAndSubmit(text) {
    if (!text.trim()) return;
    document.getElementById('message').value = text.trim();
    document.getElementById('echo-form').dispatchEvent(new Event('submit'));
}

// --- 麦克风录音 ---
function startRecording() {
    audioChunks = [];

    // 安全检查：非 HTTPS/localhost 下 mediaDevices 可能不可用
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setAsrStatus('麦克风不可用：页面需要通过 HTTPS 或 localhost 访问', 'error');
        return Promise.reject(new Error('Insecure context: getUserMedia not available'));
    }

    return navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream) {
        // 检查浏览器支持的音频编码格式
        var mimeType = '';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            mimeType = 'audio/webm;codecs=opus';
        } else if (MediaRecorder.isTypeSupported('audio/webm')) {
            mimeType = 'audio/webm';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            mimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
            mimeType = 'audio/ogg;codecs=opus';
        }
        // 如果都不支持，不传 mimeType 让浏览器自行决定
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType: mimeType } : {});
        mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = function() {
            stream.getTracks().forEach(function(t) { t.stop(); });
            var blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            callASR(blob, 'recording.webm').then(fillAndSubmit).catch(function() {});
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('btnMic').classList.add('recording');
        setAsrStatus('录音中…点击停止', 'processing');
    })
    .catch(function(err) {
        setAsrStatus('麦克风不可用: ' + err.message, 'error');
        throw err;
    });
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    isRecording = false;
    document.getElementById('btnMic').classList.remove('recording');
}

// --- 文件上传 ---
function uploadAudioFile(file) {
    if (!file) return;
    setAsrStatus('上传中…', 'processing');
    callASR(file, file.name).then(fillAndSubmit).catch(function() {});
}

// ===== 超分强度调试 =====
var srStrengthTimer = null;

function loadSrConfig() {
    fetch('./api/sr/config').then(function(r) { return r.json(); }).then(function(res) {
        var d = (res && res.data) || {};
        var status = document.getElementById('srStatus');
        if (!d.enabled) {
            status.textContent = '超分：未启用（服务端未加 --use_sr）';
            status.classList.add('error');
            return;
        }
        status.classList.remove('error');
        status.textContent = '超分：' + d.backend + ' · ' + d.device;
        if (typeof d.strength === 'number') {
            document.getElementById('srStrength').value = Math.round(d.strength * 100);
            document.getElementById('srStrengthVal').textContent = d.strength.toFixed(2);
        }
    }).catch(function() {
        document.getElementById('srStatus').textContent = '超分：读取失败';
    });
}

function onSrStrengthInput() {
    var value = parseInt(document.getElementById('srStrength').value, 10) / 100;
    document.getElementById('srStrengthVal').textContent = value.toFixed(2);
    // 拖动时防抖，300ms 内只发一次请求
    if (srStrengthTimer) clearTimeout(srStrengthTimer);
    srStrengthTimer = setTimeout(function() { saveSrStrength(value); }, 300);
}

function saveSrStrength(value) {
    fetch('./api/sr/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ strength: value })
    }).then(function(r) { return r.json(); }).then(function(res) {
        if (res.code !== 0) {
            document.getElementById('srStatus').textContent = '超分：' + (res.msg || '设置失败');
        }
    }).catch(function() {
        document.getElementById('srStatus').textContent = '超分：设置失败（网络错误）';
    });
}

// ===== 视频质量统计（码率 / 分辨率 / 帧率） =====
var videoStatCache = {};

function updateVideoStats() {
    if (!pc || pc.connectionState !== 'connected') return;
    pc.getStats().then(function(stats) {
        stats.forEach(function(report) {
            if (report.type !== 'inbound-rtp' || report.kind !== 'video') return;
            var now = report.timestamp;
            var bytes = report.bytesReceived;
            var mbps = null;
            if (videoStatCache.last && now > videoStatCache.last.timestamp) {
                var deltaBits = (bytes - videoStatCache.last.bytes) * 8;
                mbps = deltaBits / (now - videoStatCache.last.timestamp) / 1000;
            }
            videoStatCache.last = { timestamp: now, bytes: bytes };
            var w = report.frameWidth, h = report.frameHeight;
            var fps = report.framesPerSecond;
            document.getElementById('videoStats').textContent =
                (mbps === null ? '--' : mbps.toFixed(1)) + ' Mbps · ' +
                (w && h ? w + 'x' + h : '--') + ' · ' +
                (fps ? fps.toFixed(1) : '--') + ' fps';
        });
    }).catch(function() {});
}

// ===== jQuery 逻辑（原始 + 新增大模型） =====
$(document).ready(function() {
    // 默认千问模式
    switchMode('qianwen');

    // 模式切换（用 jQuery 绑定，避免 form 内 onclick 问题）
    $('#btnModeQianwen').on('click', function(e) {
        e.preventDefault();
        switchMode('qianwen');
    });
    $('#btnModeLocal').on('click', function(e) {
        e.preventDefault();
        switchMode('local');
    });
    $('#btnModeOnline').on('click', function(e) {
        e.preventDefault();
        switchMode('online');
    });

    // 麦克风录音按钮
    $('#btnMic').on('click', function(e) {
        e.preventDefault();
        if (isRecording) {
            stopRecording();
        } else {
            startRecording().catch(function(err) {
                appendMessage('system', '⚠️ 麦克风不可用: ' + err.message);
            });
        }
    });

    // 上传文件按钮
    $('#btnUpload').on('click', function(e) {
        e.preventDefault();
        document.getElementById('audioFileInput').click();
    });
    $('#audioFileInput').on('change', function(e) {
        var file = e.target.files[0];
        if (file) uploadAudioFile(file);
        this.value = ''; // 允许重复选择同一文件
    });

    // Enter 发送
    $('#message').on('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            $('#echo-form').trigger('submit');
        }
    });

    $('#echo-form').on('submit', async function(e) {
        e.preventDefault();
        var message = $('#message').val().trim();
        if (!message) return;
        var sessionid = String(document.getElementById('sessionid').value);

        // 显示用户消息
        appendMessage('user', message);
        $('#message').val('');

        // 调用大模型
        setThinking(true);
        try {
            // 先检查配置是否完整
            var cfg = getCurrentConfig();
            if (!cfg.url || !cfg.key || !cfg.model) {
                throw new Error('请先在「' + (CURRENT_MODE === 'qianwen' ? '千问' : CURRENT_MODE === 'local' ? '本地' : '线上') + '模型」中填写完整配置并保存');
            }

            conversationHistory.push({ role: 'user', content: message });
            var reply = await callDeepSeek(conversationHistory);
            conversationHistory.push({ role: 'assistant', content: reply });

            // 显示 AI 回复
            appendMessage('assistant', reply);

            // 发送到数字人驱动播报（过滤不可朗读字符）
            if (sessionid && sessionid !== '0') {
                fetch('./human', {
                    body: JSON.stringify({
                        text: sanitizeForTTS(reply),
                        type: 'echo',
                        interrupt: true,
                        sessionid: sessionid,
                    }),
                    headers: { 'Content-Type': 'application/json' },
                    method: 'POST'
                });
            } else {
                appendMessage('system', 'ℹ️ 请先点击 Start 连接数字人');
            }
        } catch (err) {
            appendMessage('system', '⚠️ 大模型连接异常');
            console.error('DeepSeek error:', err);
        } finally {
            setThinking(false);
        }
    });

    // 直接朗读：不调用大模型，直接把文本交给数字人 TTS 播报
    // Enter 播报，Shift+Enter 换行
    $('#ttsText').on('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            $('#tts-form').trigger('submit');
        }
    });

    $('#tts-form').on('submit', function(e) {
        e.preventDefault();
        var text = $('#ttsText').val().trim();
        if (!text) return;
        var sessionid = String(document.getElementById('sessionid').value);
        var status = document.getElementById('ttsStatus');
        if (!sessionid || sessionid === '0') {
            status.textContent = '请先点击 Start 连接数字人';
            status.classList.add('error');
            return;
        }
        var spoken = sanitizeForTTS(text);
        if (!spoken) {
            status.textContent = '文本里没有可朗读的内容';
            status.classList.add('error');
            return;
        }
        status.classList.remove('error');
        status.classList.add('processing');
        status.textContent = '发送中…';
        fetch('./human', {
            body: JSON.stringify({
                text: spoken,
                type: 'echo',
                interrupt: true,
                sessionid: sessionid,
            }),
            headers: { 'Content-Type': 'application/json' },
            method: 'POST'
        }).then(function(r) { return r.json(); }).then(function(res) {
            status.classList.remove('processing');
            if (res.code === 0) {
                status.textContent = '已发送朗读';
            } else {
                status.textContent = '失败：' + (res.msg || '未知错误');
                status.classList.add('error');
            }
        }).catch(function() {
            status.classList.remove('processing');
            status.classList.add('error');
            status.textContent = '发送失败（网络错误）';
        });
    });

    // 录制按钮（原始逻辑，未改动）
    $('#btn_start_record').click(function() {
        fetch('./record', {
            body: JSON.stringify({
                type: 'start_record',
                sessionid: String(document.getElementById('sessionid').value),
            }),
            headers: {
                'Content-Type': 'application/json'
            },
            method: 'POST'
        }).then(function(response) {
            if (response.ok) {
                $('#btn_start_record').prop('disabled', true);
                $('#btn_stop_record').prop('disabled', false);
            }
        });
    });

    $('#btn_stop_record').click(function() {
        fetch('./record', {
            body: JSON.stringify({
                type: 'end_record',
                sessionid: String(document.getElementById('sessionid').value),
            }),
            headers: {
                'Content-Type': 'application/json'
            },
            method: 'POST'
        }).then(function(response) {
            if (response.ok) {
                $('#btn_start_record').prop('disabled', false);
                $('#btn_stop_record').prop('disabled', true);
            }
        });
    });

    // 超分强度滑杆（拖动即生效，服务端运行时调整）
    $('#srStrength').on('input', onSrStrengthInput);
    loadSrConfig();
    setInterval(updateVideoStats, 1000);
});
</script>
